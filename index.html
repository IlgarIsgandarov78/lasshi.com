<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lasshi – Digital Home Twin</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="logo">Lasshi</h1>
    <p class="tagline">The digital memory of your home</p>

    <div class="card">
      <!-- Tabs -->
      <div class="tabs">
        <button type="button" class="tab active" onclick="showLogin()">Login</button>
        <button type="button" class="tab" onclick="showRegister()">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="form">
        <label>
          Email
          <input
            type="email"
            placeholder="you@example.com"
            required
          />
        </label>
        <label>
          Password
          <input
            type="password"
            placeholder="Your password"
            required
          />
        </label>
        <button type="submit">Login</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="form hidden">
        <label>
          Full name
          <input
            type="text"
            placeholder="John Doe"
            required
          />
        </label>
        <label>
          Email
          <input
            type="email"
            placeholder="you@example.com"
            required
          />
        </label>
        <label>
          Password
          <input
            type="password"
            placeholder="At least 6 characters"
            required
            minlength="6"
          />
        </label>
        <button type="submit">Create account</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
